<!DOCTYPE html>
<html lang="en">
    <head onload=""> <!---->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Boat Game</title>
        <script src="index.ts" type="module"></script>
        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
        <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
        <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
        <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
        <!--<script src="game.ts" type="module"></script>-->
        <style>
            body {
                background-color:rgb(247, 236, 218);
                text-align: center;
                margin: auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            div {
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin: auto;
            }
            .gameSize{
                min-width: 50vw;
                min-height: 50vh;
                width: 80vw;
                height: 80vh;
            }
            #gameFrame {
                background-color: deepskyblue;
                border:5px inset rgb(141, 62, 16);
            }
            .chooseShipOverlay{
                position: fixed;
                z-index: 1;
                background-color: rgba(0, 0, 0, 0.7);
                left: 10vw;
                border-top: 5px solid transparent;
                border-left: 5px transparent;
                
            }
            .selectShipBtns{
                visibility:visible;
            }
            #submitNameBtn{
                border: 2px solid #97551b;
                background-color: #f5e9e1;
                box-shadow: 4px 3px 2px;
                width: 110px;
                height: 40px;
            }
            #submitNameBtn:hover{
                background-color: #e2d1c5;
            }
        </style>
    </head>
    <body>
        <h1 style="margin-top:5px; margin-bottom:15px;">Boat Game</h1>
        <div style="display: block;" id="contentArea">
            <div class="chooseShipOverlay gameSize" id="chooseShipOverlay">
            <div style="height: fit-content;width: fit-content;align-self: center;background-color: antiquewhite;box-shadow: 5px 3px 2px;visibility: inherit;padding: 10px;display: flex;align-items: center;border: 3px solid brown;flex-direction: row;">
                <div>
                    <fieldset style="width:stretch; height: max-content; margin: 0px 0px 10px 0px;">
                        <legend>Select a class</legend>
                        <input type="radio" name="selectClass" id="selectSailboat" style="visibility: inherit;" value="selectSailboat"></button>
                        <label for="selectSailboat">Sailboat</label>
                        <input type="radio" name="selectClass" id="selectTrawler" style="visibility: inherit;" value="selectTrawler"></button>
                        <label for="selectTrawler">Trawler</label>
                        <input type="radio" name="selectClass" id="selectSubmarine" style="visibility: inherit;" value="selectSubmarine"></button>
                        <label for="selectSubmarine">Submarine</label>
                    </fieldset>
                    <fieldset style="width: stretch;height:max-content">
                        <legend style="text-align: left;">Name</legend>
                        <input type="text" id="nameInput" name="nameInput" style="width: stretch;">
                        <span id="nameWarning" style="color:red; visibility: hidden; display: none;">This name is already taken</span>
                    </fieldset>
                </div>
                <button id="submitNameBtn" style="margin: 0px 10px;height:50%; font-weight: bold;">Submit</button>
            </div>
        </div>
            <!--<canvas class="gameSize" id="gameArea"></canvas>-->
            <iframe class="gameSize" id="gameFrame" title="Ship Game"></iframe><!--src="water.html" src="game.html"-->
        </div>
    </body>
</html>
