// shared/Consts.ts
class PlayerLocation {
  position = [0, 0];
  angle = 0;
  velocity = 0;
  constructor(position, angle, velocity) {
    this.position = position;
    this.angle = angle;
    this.velocity = velocity;
  }
}

class ChatMessage {
  name = "";
  msg = "";
  time = [new Date().getHours(), new Date().getMinutes()];
  constructor(name, msg) {
    this.name = name;
    this.msg = msg;
  }
}
var init_Consts = () => {};

class ClientPacket {
  packetType = 0 /* NONE */;
  data;
  constructor(packetType, data) {
    this.packetType = packetType;
    this.data = data;
  }
}

// client/src/game.ts
function linkWsToGame(frame, webSocket) {
  ws = webSocket;
  canvas = iframe.window.document.body.children[0];
  iframe = frame;
  BOAT_Y_POSITION = 5;
  BOAT_SCALE = new BABYLON.Vector3(5, 5, 5);
  BOAT_STARTING_ROTATION = new BABYLON.Vector3(0, 4.712, 0);
  startGame();
}
function setJoinedWithName(joinName) {
  joinedWithName = true;
  name = joinName;
  canvas.focus();
  setInterval(queueClientAction, 10);
}
function createWaterScene(engine, canvas) {
  var scene = new BABYLON.Scene(engine);
  camera = new BABYLON.FreeCamera("Camera", new BABYLON.Vector3(0, 0, 0), scene);
  var light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0.1), scene);
  light.diffuse = new BABYLON.Color3(1, 0.992, 0.867);
  light.intensity = 0.4;
  var skybox = BABYLON.CreateBox("skyBox", { size: 1000 }, scene);
  var skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
  skyboxMaterial.backFaceCulling = false;
  skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture("textures/TropicalSunnyDay/", scene);
  skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
  skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0);
  skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
  skyboxMaterial.disableLighting = true;
  skybox.material = skyboxMaterial;
  var groundMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
  groundMaterial.diffuseTexture = new BABYLON.Texture("textures/ground.jpg", scene);
  groundMaterial.diffuseTexture.scale(4);
  ground = BABYLON.CreateGround("ground", { width: 512, height: 512, subdivisions: 32 }, scene);
  ground.position.y = -1;
  ground.material = groundMaterial;
  waterMesh = BABYLON.CreateGround("waterMesh", { width: 512, height: 512, subdivisions: 32 }, scene);
  var water = new BABYLON.WaterMaterial("water", scene);
  water.bumpTexture = new BABYLON.Texture("textures/waterbump.png", scene);
  water.windForce = 15;
  water.waveHeight = 0.6;
  water.windDirection = new BABYLON.Vector2(1, 1);
  water.waterColor = new BABYLON.Color3(0.11, 0.3, 0.75);
  water.colorBlendFactor = 0.8;
  water.bumpHeight = 0.1;
  water.waveLength = 0.6;
  water.addToRenderList(skybox);
  water.addToRenderList(ground);
  waterMesh.material = water;
  loadBoatMesh(scene, new BABYLON.Vector3(0, BOAT_Y_POSITION, 0));
  loadCompassMesh();
  return scene;
}
function setupUI() {
  const body = iframe.document.body;
  body.style.flexDirection = "row";
  const ui_minimap = iframe.document.createElement("button");
  const minimap_img = iframe.document.createElement("img");
  minimap_img.src = "textures/ui/minimap.png";

function rotateGizmo(currentAngle, maxAngle, quaternionRot, minAngle) {
  let res = new RotationResult;

  if (!minAngle) {
    minAngle = maxAngle * -1;
  }
  if (currentAngle < minAngle) {
    finalRot = minAngle;
  } else if (currentAngle > maxAngle) {
    finalRot = maxAngle;
  }
  if (finalRot != currentAngle) {
    res.boundsHit = true;
  }
  if (quaternionRot) {
    res.finalAngle = finalRot * (Math.PI / 180);
    res.type = 0 /* QUATERNION_ROT */;
  } else {
    res.finalAngle = finalRot * (Math.PI / 180);
    res.type = 1 /* EULER_ROT */;
  }
  return res;
}

    chatDisplayLeft = Math.round(chatBox.getBoundingClientRect().x) * 100 / iframe.document.documentElement.clientWidth + "vw";
    chatDisplay.style.bottom = chatDisplayBottom;
    chatDisplay.style.left = chatDisplayLeft;
    newChatPopup.style.bottom = chatDisplayBottom;
    newChatPopup.style.left = chatDisplayLeft;
  });
});

// client/src/index.ts
init_Consts();
init_PacketTypes();
var ws2 = new WebSocket("https://mpfishinggame-babylonjs.onrender.com/");
var gameFrameWindow;
var gameModule = await Promise.resolve().then(() => (init_game(), {}));
addEventListener("load", async () => {
  const gameFrame = document.getElementById("gameFrame");
  gameFrameWindow = gameFrame.contentWindow;
  gameFrameWindow.name = "gameFrameWindow";
  gameFrame.srcdoc = `
    <html>
        <head>
            <style>
            html, body, canvas{ 
                width: 100%;
                height: 100%; 
                margin: 0; 
                padding: 0; 
                overflow: hidden; 
                background: #000; 
                flex-direction: none;
            }
            </style>         
        </head>
        <body>
            <canvas id=renderCanvas></canvas>
            
        </body>
    </html>`;
  (async function linkGameToIFrame() {
    linkWsToGame(gameFrameWindow, ws2);
  }).call(gameFrame.contentDocument);
});
var nameInput = document.getElementById("nameInput");
var ship = 0 /* NONE */;
var shipSelectRadioBtns = document.getElementsByName("selectClass");
var selectedShipBtn;
for (let btn of shipSelectRadioBtns) {
  btn.addEventListener("change", (event) => {
    selectedShipBtn = btn;
    console.log(btn.value);
    switch (btn.value) {
      case "selectSailboat":
        ship = 1 /* SAILBOAT */;
        break;
      case "selectTrawler":
        ship = 2 /* TRAWLER */;
        break;
      case "selectSubmarine":
        ship = 6 /* SUBMARINE */;
        break;
      case "selectCargo":
        ship = 4 /* CARGO */;
        break;
      case "selectDredger":
        ship = 3 /* DREDGER */;
        break;
      case "selectSurveyor":
        ship = 5 /* SURVEYOR */;
        break;
      default:
        return;
    }
  });
  btn.addEventListener("mouseenter", (event) => {
    if (btn != selectedShipBtn) {
      btn.style.backgroundColor = "rgb(222, 184, 135)";
    }
  });
  btn.addEventListener("mouseleave", (event) => {
    if (btn != selectedShipBtn) {
      btn.style.backgroundColor = "antiquewhite";
    }
  });
  btn.addEventListener("keyup", (event) => {
    if (btn.type == "radio" && !event.key.includes("Arrow")) {
      nameInput.focus();
    }
  });
}
var name2;
var submitNameBtn = document.getElementById("submitNameBtn");
submitNameBtn.addEventListener("click", () => {
  joinGame();
});
nameInput.addEventListener("keyup", (event) => {
  if (event.key == "Enter") {
    joinGame();
  }
});
function joinGame() {
  name2 = nameInput.value;
  if (ship != 0 /* NONE */) {
    ws2.send(JSON.stringify(new ClientPacket(1 /* JOIN_WITH_NAME */, {
      name: name2,
      type: ship
    })));
  }
}
var chooseShipOverlay = document.getElementById("chooseShipOverlay");
var nameWarning = document.getElementById("nameWarning");
ws2.addEventListener("message", (event) => {
  let msg = JSON.parse(event.data);
  switch (msg.packetType) {
    case 1 /* DUPLICATE_NAME_DETECTED */:
      nameWarning.style.visibility = "visible";
      nameWarning.style.display = "block";
      nameWarning.textContent = "This name is already taken";
      break;
    case 3 /* INVALID_NAME_DETECTED */:
      nameWarning.style.visibility = "visible";
      nameWarning.style.display = "block";
      nameWarning.textContent = "Please use a valid name";
      break;
    case 2 /* JOIN_ACCEPTED */:
      nameWarning.style.visibility = "hidden";
      nameWarning.style.display = "none";
      chooseShipOverlay.style.visibility = "hidden";
      nameWarning.textContent = "";
      if (gameModule && gameFrameWindow) {
        if (typeof setJoinedWithName === "function") {
          setJoinedWithName.call(gameFrameWindow, name2);
        }
      }
      break;
    case 4 /* PLAYER_START_POSITIONS */:
      const posList = msg.data;
      if (gameModule && gameFrameWindow) {
        for (let player of posList) {
          if (player.name != name2 && player.name != "") {
            addOtherBoat.call(gameFrameWindow, player);
            console.log(`${player.name} boat added`);
          }
        }
      }
      break;
    case 5 /* UPDATE_GLOBAL_PLAYER_POSITIONS */:
      const playerPositions = msg.data;
      if (gameModule) {
        for (let player of playerPositions) {
          if (player.name != name2 && player.name != "") {
            updateExistingPlayerLocation(player);
          }
        }
      }
      break;
    case 6 /* INCOMING_CHAT_MESSAGE */:
      displayInboundChat(msg.data);
      break;
    case 7 /* PLAYER_LEFT_EXPERIENCE */:
      removePlayerShipOnLeave(msg.data);
      break;
    default:
      console.log("fail");
  }
});
ws2.addEventListener("close", () => {
  window.location.reload();
});
