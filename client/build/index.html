<!DOCTYPE html>
<html lang="en">
    <head onload=""> <!---->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Boat Game</title>
        
        <!--<script src="game.ts" type="module"></script>-->
        <style>
            body {
                background-color:rgb(247, 236, 218);
                text-align: center;
                margin: auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            div {
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin: auto;
            }
            .gameSize{
                min-width: 50vw;
                min-height: 50vh;
                width: 80vw;
                height: 80vh;
            }
            #gameFrame {
                background-color: deepskyblue;
                border:5px inset rgb(141, 62, 16);
            }
            .chooseShipOverlay{
                position: fixed;
                z-index: 1;
                background-color: rgba(0, 0, 0, 0.7);
                left: 10vw;
                border-top: 5px solid transparent;
                border-left: 5px transparent;
                
            }
            .selectShipBtns{
                visibility:visible;
            }
            .newBtnStyle{
                border: 3px inset peachpuff;
                background-color: antiquewhite;
                box-shadow: 4px 3px 2px;
                width: 110px;
                height: 40px;
            }
            .newBtnStyle:hover{
                background-color: rgb(222, 184, 135);
            }
        </style>
    </head>
    <body>
        <h1 style="margin-top:5px; margin-bottom:15px;">Boat Game</h1>
        <div style="display: block;" id="contentArea">
            <div class="chooseShipOverlay gameSize" id="chooseShipOverlay">
            <table class="gameSize" style="height: fit-content; width: fit-content; align-self: center; background-color: antiquewhite; box-shadow: 5px 3px 2px; visibility: inherit;">
                <tr style="visibility: inherit;">
                    <td><button class="newBtnStyle selectShipBtns" id="selectSailboat" style="visibility: inherit;">Sailboat</button></td>
                    <td><button class="newBtnStyle selectShipBtns" id="selectTrawler" style="visibility: inherit;">Trawler</button></td>
                    <td><button class="newBtnStyle selectShipBtns" id="selectSubmarine" style="visibility: inherit;">Submarine</button></td>
                </tr>
                <tr>
                    <td></td>
                    <td><div style="padding: 5px 10px; width: 200px; text-align: left;">
                        <label for="nameInput">Name:</label>
                        <input type="text" id="nameInput" name="nameInput">
                    </div></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button class="newBtnStyle" id="submitNameBtn"><b>Submit</b></button></td>
                </tr>
            </table>
        </div>
            <!--<canvas class="gameSize" id="gameArea"></canvas>-->
            <iframe class="gameSize" id="gameFrame" title="Ship Game"></iframe><!--src="water.html" src="game.html"-->
        </div>
    <script type="module">// shared/PacketTypes.ts
class ClientPacket {
  packetType = 0 /* NONE */;
  data;
  constructor(packetType, data) {
    this.packetType = packetType;
    this.data = data;
  }
}

// client/src/index.ts
var ws = new WebSocket("http://localhost:2323");
var gameFrame = document.getElementById("gameFrame");
gameFrame.srcdoc = `
<html>
    <head>
        <style>
        html, body, canvas{ 
            width: 100%;
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        </style>
        <script src="https://cdn.babylonjs.com/babylon.js"><\/script>
        <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"><\/script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"><\/script>
        <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"><\/script>
        <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"><\/script>
        <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"><\/script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"><\/script>
        <script src=https://the-glimmered-ones.github.io/multiplayer-boat-game/game.js type=module><\/script>


    </head>
    <body>
        <canvas id=renderCanvas></canvas>
    </body>
</html>`;
var gameFrameDoc = gameFrame.contentWindow;
var nameInput = document.getElementById("nameInput");
var selectSailboat = document.getElementById("selectSailboat");
var selectTrawler = document.getElementById("selectTrawler");
var selectSubmarine = document.getElementById("selectSubmarine");
var ship = 0 /* NONE */;
var shipSelectBtns = document.getElementsByClassName("selectShipBtns");
var selectedShipBtn;
for (let btn of shipSelectBtns) {
  btn.addEventListener("click", (event) => {
    selectedShipBtn = btn;
    selectSailboat.style.backgroundColor = selectTrawler.style.backgroundColor = selectSubmarine.style.backgroundColor = "antiquewhite";
    switch (btn.id) {
      case "selectSailboat":
        if (ship == 1 /* SAILBOAT */) {
          selectSailboat.style.backgroundColor = "antiquewhite";
          ship = 0 /* NONE */;
          return;
        }
        ship = 1 /* SAILBOAT */;
        selectSailboat.style.backgroundColor = "rgb(222, 184, 135)";
        break;
      case "selectTrawler":
        if (ship == 2 /* TRAWLER */) {
          selectTrawler.style.backgroundColor = "antiquewhite";
          ship = 0 /* NONE */;
          return;
        }
        ship = 2 /* TRAWLER */;
        selectTrawler.style.backgroundColor = "rgb(222, 184, 135)";
        break;
      case "selectSubmarine":
        if (ship == 3 /* SUBMARINE */) {
          selectSubmarine.style.backgroundColor = "antiquewhite";
          ship = 0 /* NONE */;
          return;
        }
        ship = 3 /* SUBMARINE */;
        selectSubmarine.style.backgroundColor = "rgb(222, 184, 135)";
        break;
      default:
        return;
    }
  });
  btn.addEventListener("mouseenter", (event) => {
    btn.style.backgroundColor = "rgb(222, 184, 135)";
  });
  btn.addEventListener("mouseleave", (event) => {
    if (btn != selectedShipBtn) {
      btn.style.backgroundColor = "antiquewhite";
    }
  });
}
var name;
var submitNameBtn = document.getElementById("submitNameBtn");
submitNameBtn.addEventListener("click", () => {
  name = nameInput.value;
  if (name != "" && ship) {
    ws.send(JSON.stringify(new ClientPacket(1 /* JOIN_WITH_NAME */, name)));
    console.log("join request sent");
  }
});
var chooseShipOverlay = document.getElementById("chooseShipOverlay");
ws.addEventListener("message", (event) => {
  let msg = JSON.parse(event.data);
  switch (msg.packetType) {
    case 1 /* DUPLICATE_NAME_DETECTED */:
      break;
    case 3 /* INVALID_NAME_DETECTED */:
      break;
    case 2 /* JOIN_ACCEPTED */:
      console.log("hidden");
      if (gameFrameDoc && gameFrameDoc.document.scripts.length != 0) {
        if (typeof gameFrameDoc.setJoinedWithName === "function") {
          gameFrameDoc.setJoinedWithName(true);
          console.log("joined with name");
        }
      }
      chooseShipOverlay.style.visibility = "hidden";
      break;
    case 4 /* UPDATE_GLOBAL_PLAYER_POSITIONS */:
      const playerPositions = msg.data;
      if (gameFrameDoc && gameFrameDoc.document.scripts.length != 0) {
        for (let player of playerPositions) {
          if (player.name != name)
            gameFrameDoc.addOtherBoat(player);
        }
      }
      break;
    default:
      console.log("fail");
  }
});
</script></body>
</html>
